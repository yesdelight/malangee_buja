<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="사진 속 뭐든 말랑하게. 내 사진으로 만드는 디지털 말랑이." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <title>말랑이 부자</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="wordmark" href="/" aria-label="말랑이 부자 홈">말랑이 부자</a>
        <div class="top-actions"><span id="save-state" class="save-state">저장됨</span><button class="icon-btn" id="menu-button" aria-label="메뉴">···</button></div>
      </header>
      <main class="playground" id="playground">
        <canvas id="scene" aria-label="말랑이 놀이터. 오브젝트를 눌러보고 끌어보세요."></canvas>
        <div class="empty-state" id="empty-state"><span class="empty-mark">＋</span><strong>사진 넣고, 눌러봐.</strong><button class="text-action" id="empty-add">사진 선택</button></div>
        <div class="status-pill" id="status-pill" role="status" aria-live="polite"></div>
        <div class="object-dock" id="object-dock" aria-label="선택한 말랑이 조작">
          <button class="dock-button" id="stretch-button" aria-label="늘리기"><span>↔</span><small>늘리기</small></button>
          <button class="dock-button" id="bounce-button" aria-label="튕기기"><span>↗</span><small>튕기기</small></button>
          <button class="dock-button" id="material-button" aria-label="물성 변경"><span>◉</span><small id="material-label">말랑</small></button>
          <button class="dock-button" id="sound-button" aria-label="소리 켜기"><span>♫</span><small id="sound-label">소리 켬</small></button>
          <button class="dock-button danger" id="delete-button" aria-label="말랑이 삭제"><span>×</span><small>삭제</small></button>
        </div>
      </main>
      <footer class="bottom-bar">
        <div class="object-count"><span class="count-dot"></span><span id="count-label">말랑이 0개</span></div>
        <div class="bottom-actions">
          <button class="secondary-button" id="share-button" aria-label="놀이터 공유"><span>↗</span><span>공유</span></button>
          <button class="primary-button" id="add-button"><span class="plus">＋</span><span>사진 넣기</span></button>
        </div>
      </footer>
      <input id="photo-input" type="file" accept="image/*" multiple hidden />
      <section class="sheet" id="selection-sheet" aria-modal="true" role="dialog" aria-labelledby="sheet-title" hidden>
        <div class="sheet-scrim" data-close-sheet></div>
        <div class="sheet-panel"><div class="sheet-handle"></div><button class="sheet-close" data-close-sheet aria-label="닫기">×</button><p class="eyebrow" id="sheet-eyebrow">대상 선택</p><h1 id="sheet-title">어떤 걸 말랑하게 할까?</h1><p class="sheet-description" id="sheet-description">사진 속 대상은 이 기기에서 분리돼.</p><div class="candidate-list" id="candidate-list"></div></div>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
